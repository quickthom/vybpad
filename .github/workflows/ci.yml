name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vybpad_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vybpad_ci
      # Prefer repository secrets CI_JWT_SECRET / CI_JWT_REFRESH_SECRET (32+ chars). Fallback literals are CI-only, non-production placeholders.
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-jwt-secret-must-be-at-least-32-characters-long' }}
      JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET || 'ci-refresh-secret-must-be-at-least-32-characters-long' }}
      CORS_ORIGIN: http://127.0.0.1:5173
      # Must match apiClient default / Playwright origin so credentialed API calls are same-site with the Vite dev server.
      VITE_API_URL: http://127.0.0.1:3001
      NODE_ENV: development
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Database schema
        run: npx prisma db push --schema=prisma/schema.prisma

      - name: Typecheck / build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: End-to-end tests
        run: npm run test:e2e
