# Nginx — static SPA + /api upstream + long-cache samples (TASK-8.5)
# TLS terminates in front of this container (Caddy, cloud LB, or host nginx) — see docs/HTTPS.md

upstream vybpad_api {
    zone vybpad_api 64k;
    server api:3001 resolve;
    keepalive 32;
}
resolver 127.0.0.11 valid=15s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://vybpad_api;
        proxy_read_timeout 120s;
    }

    # Piano SoundFont samples — large static assets (ARCHITECTURE.md)
    location /samples/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
